  esbuild: true
  nx: true
  sharp: true

catalog:
  "@biomejs/biome": ^2.5.14
  "@graphql-tools/webpack-loader": ^7.0.1
  "@nx/js": 23.2.1
  "@nx/nest": 23.2.1
  "@nx/next": 23.2.1
  flydrive: "^2.1.0"
  "@aws-sdk/client-s3": "3.850.0"
  "@aws-sdk/lib-storage": "3.850.0"
  "@aws-sdk/s3-request-presigner": "3.850.0"
  "@nx/playwright": 23.2.1
  "@nx/workspace": 23.2.1
  "@types/nodemailer": "8.0.2"
  "@types/react": "^19"
  "@types/react-dom": "^19"
  "@nestjs-modules/mailer": "2.3.7"
  nodemailer: "8.0.11"
  "@react-email/components": "^0.3.2"
  "@aws-sdk/client-sesv2": "3.918.0"
  firebase-admin: "^13.4.0"
  html-to-text: "^9.0.5"
