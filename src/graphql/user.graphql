"""
Quem tem conta. Interface, e não tipo, porque a hierarquia do domínio é polimórfica.
"""
interface User {
  id: ID!
  name: String!
  email: String!
}

"""
Usuário que só lê: autentica, vê posts, assina atualizações. É o `Reader` do domínio — linha em
`users`, linha em `readers`, e nenhum campo a mais.

Não escrever não é uma permissão que falta: é um campo que não existe.
"""
type Reader implements User {
  id: ID!
  name: String!
  email: String!
}

"""
Usuário que escreve. É o `Author` do domínio: na herança multi-tabela (`inheritance: 'tpt'`), linha em
`users` **e** linha em `authors`.

O campo `posts` não está declarado aqui — ele tem resolver próprio, e mora em `author-posts.graphql`.
"""
type Author implements User {
  id: ID!
  name: String!
  email: String!
}
