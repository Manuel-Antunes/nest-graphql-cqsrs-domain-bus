"""Uma tag. Agregado próprio: tem id e eventos independentes do post."""
type Tag {
  id: ID!
  name: String!
}

type TagConnection {
  edges: [TagEdge!]!
  pageInfo: PageInfo!

  """Total de itens; null quando a fonte não conta"""
  totalCount: Int
}

type TagEdge {
  cursor: String!
  node: Tag!
}
