extend type Query {
  """
  Who is logged in.

  Requires a session — without the Better Auth cookie the global guard refuses before the resolver
  runs, which is the `@PreAuthorize("isAuthenticated()")` of the Axon version. Note there is no
  argument: the target is always whoever is asking.

  The first time a new credential shows up, the domain profile is created — or reattached to the one
  that already exists, by email — without the client asking for anything: that is the *just-in-time*
  provisioning of `UserProvisioning`. On the normal path this already happened at sign-up, through
  the hook, and here it is only a read.

  Returns the **interface**: use a fragment to reach what only exists on `Author`.

      me {
        id
        name
        email
        ... on Author {
          posts(first: 5) { edges { node { title } } totalCount }
        }
      }

  For a user without the author role the same fragment simply does not match — and the answer comes
  back without `posts`, instead of with an empty list.
  """
  me: IUser!
}
