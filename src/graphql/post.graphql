"""
Read model de um Post. Mesmo shape em queries, mutations e subscriptions.
"""
type Post {
  id: ID!
  title: String!
  content: String!
  createdAt: DateTime!
  updatedAt: DateTime!

  """Quantidade de eventos aplicados (1 = só criado)"""
  version: Int!
}

type PostConnection {
  edges: [PostEdge!]!
  pageInfo: PageInfo!

  """Total de itens; null quando a fonte não conta"""
  totalCount: Int
}

type PostEdge {
  cursor: String!
  node: Post!
}
