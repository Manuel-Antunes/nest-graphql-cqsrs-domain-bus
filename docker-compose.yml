# The broker and the database. Every service shares ONE Postgres, laid out by tenancy rather than by
# service: `public` holds the system tables (Better Auth, organizations), `transport` the inbox and
# the event log, and `tenant_<name>` a tenant's own tables — `tenant_root` for whoever names none.
# The migrator creates the first three; a service migrates an organization's schema on its first
# request, from the tenant migrations its bundle carries.
#
# POR QUE UMA FILA POR SERVIÇO, E NÃO UMA COMPARTILHADA
# ====================================================
# No RabbitMQ a cópia é por fila vinculada, não por consumidor: dois serviços na mesma fila COMPETEM
# pelas mensagens em vez de receberem cópias, e quem descarta dá ack e mata a mensagem do outro. As
# filas e os bindings são declarados pelas próprias aplicações na partida — `exchangeType: 'topic'` com
# `wildcards: true`, que é o que faz o pattern do `@EventPattern` ser a routing key.
services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: nestposts-rabbitmq
    ports:
      # RABBITMQ_PORT exists for the same reason POSTGRES_PORT does: another project on the machine
      # may already hold the default. Whoever moves it moves RABBITMQ_URL with it.
      - "${RABBITMQ_PORT:-5672}:5672"
      # A API de management, que o teste da saga usa para republicar uma mensagem na mão — é assim que
      # ele prova a idempotência do inbox, e de passagem valida o formato de fio.
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:18-alpine
    container_name: nestposts-postgres
    ports:
      # POSTGRES_PORT existe porque 5432 costuma já estar ocupado por outro projeto na máquina. Quem
      # o mudar muda também a POSTGRES_URL — o padrão dos dois é 5432.
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nestposts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nestposts}
      POSTGRES_DB: ${POSTGRES_DB:-nestposts}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nestposts} -d ${POSTGRES_DB:-nestposts}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  # THE APPLICATIONS, under the `apps` profile — `docker compose --profile apps up -d --build`.
  #
  # They are off by default because the ordinary loop is `pnpm dev`, which runs them from source with
  # a watcher. What the profile is for is the other two: a stack somebody can bring up without a
  # toolchain, and the images `apps/web-e2e` drives through Testcontainers.
  #
  # Each image is the one its own `Dockerfile` builds, named exactly as `nx run <app>:docker:build`
  # tags it — so a `docker compose --profile apps up` after an `nx docker:build` reuses what Nx
  # already produced instead of building it twice.
  #
  # INSIDE the network everything addresses everything by service name on its REAL port: the
  # applications talk to `postgres:5432` and `rabbitmq:5672`, never to a published one. Only what the
  # host has to reach is published.
  migrator:
    profiles: ["apps"]
    image: nestposts/migrator:dev
    build:
      context: .
      dockerfile: apps/migrator/Dockerfile
    container_name: nestposts-migrator
    command: ["setup"]
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-nestposts}:${POSTGRES_PASSWORD:-nestposts}@postgres:5432/${POSTGRES_DB:-nestposts}
      AUTH_SECRET: ${AUTH_SECRET:-nestposts-compose-secret}
      GATEWAY_URL: http://localhost:${GATEWAY_PORT:-4000}/graphql
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  posts-api:
    profiles: ["apps"]
    image: nestposts/posts-api:dev
    build:
      context: .
      dockerfile: apps/posts-api/Dockerfile
    container_name: nestposts-posts-api
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      POSTGRES_URL: postgresql://${POSTGRES_USER:-nestposts}:${POSTGRES_PASSWORD:-nestposts}@postgres:5432/${POSTGRES_DB:-nestposts}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      POSTS_TRANSPORT: ${POSTS_TRANSPORT:-inngest}
      INNGEST_BASE_URL: http://inngest:8288
      INNGEST_SERVE_ORIGIN: http://posts-api:3000
      AUTH_SECRET: ${AUTH_SECRET:-nestposts-compose-secret}
      AUTH_URL: http://localhost:${API_PORT:-3000}
      WEB_URL: http://localhost:${WEB_PORT:-4300}
      AUTH_TRUSTED_ORIGINS: http://localhost:${API_PORT:-3000},http://localhost:${WEB_PORT:-4300}
      GATEWAY_URL: http://localhost:${GATEWAY_PORT:-4000}/graphql
      DRIVE_BUCKET: ${DRIVE_BUCKET:-local}
      DRIVE_AWS_REGION: ${DRIVE_AWS_REGION:-us-east-1}
      DRIVE_AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-sail}
      DRIVE_AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password}
      DRIVE_S3_ENDPOINT: http://minio:9000
      DRIVE_S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-9000}
      DRIVE_S3_FORCE_PATH_STYLE: "true"
    depends_on:
      createbuckets:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      inngest:
        condition: service_started
      migrator:
        condition: service_completed_successfully
  minio:
    image: minio/minio:latest
    container_name: nestposts-minio
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-8900}:8900"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sail}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
    volumes:
      - minio-data:/data/minio
    command: minio server /data/minio --console-address ":8900"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  createbuckets:
    image: minio/mc
    container_name: nestposts-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set minio http://minio:9000 ${MINIO_ROOT_USER:-sail} ${MINIO_ROOT_PASSWORD:-password} &&
      /usr/bin/mc mb --ignore-existing minio/${DRIVE_BUCKET:-local} &&
      /usr/bin/mc anonymous set download minio/${DRIVE_BUCKET:-local}/tmp &&
      /usr/bin/mc anonymous set download minio/${DRIVE_BUCKET:-local}/assets
      "
    restart: "no"

  tagging:
    profiles: ["apps"]
    image: nestposts/tagging:dev
    build:
      context: .
      dockerfile: apps/tagging/Dockerfile
    container_name: nestposts-tagging
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-nestposts}:${POSTGRES_PASSWORD:-nestposts}@postgres:5432/${POSTGRES_DB:-nestposts}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      TAGGING_TRANSPORT: ${TAGGING_TRANSPORT:-inngest}
      INNGEST_BASE_URL: http://inngest:8288
      INNGEST_SERVE_ORIGIN: http://tagging:3001
      TAGGING_PORT: "3001"
    depends_on:
      rabbitmq:
        condition: service_healthy
      inngest:
        condition: service_started
      migrator:
        condition: service_completed_successfully

  notificator:
    profiles: ["apps"]
    image: nestposts/notificator:dev
    build:
      context: .
      dockerfile: apps/notificator/Dockerfile
    container_name: nestposts-notificator
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-nestposts}:${POSTGRES_PASSWORD:-nestposts}@postgres:5432/${POSTGRES_DB:-nestposts}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      NOTIFICATOR_TRANSPORT: ${NOTIFICATOR_TRANSPORT:-inngest}
      INNGEST_BASE_URL: http://inngest:8288
      INNGEST_SERVE_ORIGIN: http://notificator:3002
      NOTIFICATOR_PORT: "3002"
      AUTH_SECRET: ${AUTH_SECRET:-nestposts-compose-secret}
      WEB_URL: http://localhost:${WEB_PORT:-4300}
      GATEWAY_URL: http://localhost:${GATEWAY_PORT:-4000}/graphql
      MAIL_SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: ${MAIL_FROM:-Nest Posts <no-reply@nestposts.local>}
    depends_on:
      rabbitmq:
        condition: service_healthy
      inngest:
        condition: service_started
      mailpit:
        condition: service_started
      migrator:
        condition: service_completed_successfully

  # Every email sent locally lands here: SMTP on 1025, the inbox — a UI and a REST API — on 8025.
  # `apps/notificator` sends to it by default (`MAIL_SMTP_URL=smtp://localhost:1025`).
  mailpit:
    image: axllent/mailpit:latest
    container_name: nestposts-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_PORT:-8025}:8025"

  # `NEXT_PUBLIC_API_URL` is the INTERNAL address, and that is not a slip: `apps/web/src/lib/env.ts`
  # is read by server components and by the `/api/graphql` route, never by the browser — the browser
  # only ever talks to this origin.
  web:
    profiles: ["apps"]
    image: nestposts/web:dev
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nestposts-web
    ports:
      - "${WEB_PORT:-4300}:3000"
    environment:
      PORT: "3000"
      POSTGRES_URL: postgresql://${POSTGRES_USER:-nestposts}:${POSTGRES_PASSWORD:-nestposts}@postgres:5432/${POSTGRES_DB:-nestposts}
      AUTH_SECRET: ${AUTH_SECRET:-nestposts-compose-secret}
      WEB_URL: http://localhost:${WEB_PORT:-4300}
      NEXT_PUBLIC_API_URL: http://posts-api:3000
      NEXT_PUBLIC_GATEWAY_URL: http://gateway:4000/graphql
      POSTS_SUBGRAPH_URL: http://posts-api:3000/graphql
      GATEWAY_URL: http://localhost:${GATEWAY_PORT:-4000}/graphql
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      WEB_TRANSPORT: ${WEB_TRANSPORT:-inngest}
      INNGEST_BASE_URL: http://inngest:8288
    depends_on:
      gateway:
        condition: service_started

  # The federation gateway: the one GraphQL endpoint a client talks to. It composes the supergraph
  # from the subgraphs' SDL, baked into its image, and forwards each caller's cookie and bearer to
  # every subgraph an operation reaches.
  gateway:
    profiles: ["apps"]
    image: nestposts/gateway:dev
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: nestposts-gateway
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    environment:
      GATEWAY_PORT: "4000"
      GATEWAY_URL: http://localhost:${GATEWAY_PORT:-4000}/graphql
      POSTS_SUBGRAPH_URL: http://posts-api:3000/graphql
      NOTIFICATIONS_SUBGRAPH_URL: http://notificator:3002/graphql
      WEB_URL: http://localhost:${WEB_PORT:-4300}
      AUTH_URL: http://posts-api:3000
    depends_on:
      posts-api:
        condition: service_started
      notificator:
        condition: service_started

  # The Inngest dev server: the local default transport's broker-equivalent.
  #
  # It is told where each service serves its functions (`-u`), because discovery by scanning ports
  # finds nothing when the services are containers on a network of their own. Inngest reaches a
  # service by CALLING it, which is why `tagging` has an HTTP port at all in this mode.
  inngest:
    image: inngest/inngest:latest
    container_name: nestposts-inngest
    command:
      - inngest
      - dev
      - --no-discovery
      - -u
      - http://posts-api:3000/api/inngest
      - -u
      - http://tagging:3001/api/inngest
      - -u
      - http://notificator:3002/api/inngest
    ports:
      - "${INNGEST_PORT:-8288}:8288"

  # SNS and SQS, locally. The AWS transport is the same code path as the RabbitMQ one — the topic is
  # the exchange, a queue subscribed with a filter policy is a binding — so this is what makes
  # `POSTS_TRANSPORT=aws pnpm dev` a real exercise of what deploys, rather than a mock.
  #
  # The topology is created by `docker/localstack/init/10-messaging.sh`, which LocalStack runs once
  # the services are ready. Point the applications at it with:
  #
  #   export AWS_ENDPOINT_URL=http://localhost:4566
  #   export AWS_REGION=us-east-1
  localstack:
    image: localstack/localstack:4
    container_name: nestposts-localstack
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: sns,sqs
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - ./docker/localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", "awslocal sqs list-queues && awslocal sns list-topics"]
      interval: 5s
      timeout: 10s
      retries: 20

volumes:
  minio-data:
