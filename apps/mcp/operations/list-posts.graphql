query ListPosts($first: Int = 20, $after: String) {
  posts(first: $first, after: $after) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        id
        title
        createdAt
        updatedAt
        version
        author {
          id
          name
        }
        tags(first: 10) {
          edges {
            node {
              id
              name
            }
          }
        }
      }
    }
  }
}
