x-base: &base
  build:
    # Folder context. The lighthouse-graphql path gem is vendored into
    # .workspace-gems first — run `nx prune chatwoot` (or `pnpm nx prune chatwoot`)
    # before building.
    context: .
    dockerfile: Dockerfile
    args:
      BUNDLE_WITHOUT: ""
      RAILS_ENV: "development"
      RAILS_SERVE_STATIC_FILES: "false"
  tty: true
  stdin_open: true
  image: chatwoot:development
  env_file: ../../.env

services:
  rails:
    <<: *base
    image: chatwoot:development
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules
      - packs:/app/public/packs
      - cache:/app/tmp/cache
      - bundle:/usr/local/bundle
    depends_on:
      - redis
      - vite
      - mailhog
    ports:
      - 4005:4005
    env_file: ../../.env
    environment:
      # Development Settings
      - VITE_DEV_SERVER_HOST=vite
      - NODE_ENV=development
      - RAILS_ENV=development
      - BUNDLE_WITHOUT=''

      # Database
      - POSTGRES_HOST=pgsql
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=lucid
      - POSTGRES_PASSWORD=lucid
      - POSTGRES_DATABASE=lucid
      # - POSTGRES_STATEMENT_TIMEOUT=14s
      - RAILS_MAX_THREADS=5

      # Redis
      - REDIS_URL=redis://redis:6379
      # - REDIS_PASSWORD=
      # - REDIS_SENTINELS=
      # - REDIS_SENTINEL_MASTER_NAME=mymaster
      # - REDIS_SENTINEL_PASSWORD=
      # - REDIS_OPENSSL_VERIFY_MODE=none

      # Security
      - SECRET_KEY_BASE=replace_with_lengthy_secure_hex
      # Active Record Encryption (required for MFA/2FA)
      # - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=
      # - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=
      # - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=

      # URLs
      - FRONTEND_URL=http://localhost:4005
      - BACKEND_URL=http://localhost:4005
      - BASE_URL=http://localhost:3333
      - ACTION_CABLE_ALLOWED_REQUEST_ORIGINS=http://localhost:4005
      - ACTION_CABLE_URL=ws://localhost:4005/cable
      # - HELPCENTER_URL=http://0.0.0.0:3000
      # - ASSET_CDN_HOST=

      # Application Settings
      - FORCE_SSL=false
      - ENABLE_ACCOUNT_SIGNUP=false
      # - CW_API_ONLY_SERVER=false

      # Email - SMTP
      - SMTP_ADDRESS=mailhog
      - SMTP_PORT=1025
      - SMTP_DOMAIN=chatwoot.com
      - SMTP_USERNAME=
      - SMTP_PASSWORD=
      - SMTP_AUTHENTICATION=plain
      - SMTP_ENABLE_STARTTLS_AUTO=true
      - SMTP_OPENSSL_VERIFY_MODE=peer
      - MAILER_SENDER_EMAIL=Chatwoot <accounts@chatwoot.com>
      # - SMTP_TLS=
      # - SMTP_SSL=
      # - SMTP_OPEN_TIMEOUT=
      # - SMTP_READ_TIMEOUT=

      # Email - Incoming
      # - MAILER_INBOUND_EMAIL_DOMAIN=
      # - RAILS_INBOUND_EMAIL_SERVICE=
      # - RAILS_INBOUND_EMAIL_PASSWORD=
      # - MAILGUN_INGRESS_SIGNING_KEY=
      # - MANDRILL_INGRESS_API_KEY=
      # - ACTION_MAILBOX_SES_SNS_TOPIC=

      # Storage
      - ACTIVE_STORAGE_SERVICE=local
      # - S3_BUCKET_NAME=
      # - AWS_ACCESS_KEY_ID=
      # - AWS_SECRET_ACCESS_KEY=
      # - AWS_REGION=

      # Logging
      - RAILS_LOG_TO_STDOUT=true
      - LOG_LEVEL=info
      - LOG_SIZE=500
      # - LOGRAGE_ENABLED=true

      # Social Media Channels
      # - FB_VERIFY_TOKEN=
      # - FB_APP_SECRET=
      # - FB_APP_ID=
      # - IG_VERIFY_TOKEN=
      # - TWITTER_APP_ID=
      # - TWITTER_CONSUMER_KEY=
      # - TWITTER_CONSUMER_SECRET=
      # - TWITTER_ENVIRONMENT=

      # Integrations
      # - SLACK_CLIENT_ID=
      # - SLACK_CLIENT_SECRET=
      # - GOOGLE_OAUTH_CLIENT_ID=
      # - GOOGLE_OAUTH_CLIENT_SECRET=
      # - GOOGLE_OAUTH_CALLBACK_URL=

      # Mobile Apps
      - IOS_APP_ID=L7YLMN4634.com.chatwoot.app
      - ANDROID_BUNDLE_ID=com.chatwoot.app
      - ANDROID_SHA256_CERT_FINGERPRINT=AC:73:8E:DE:EB:56:EA:CC:10:87:02:A7:65:37:7B:38:D4:5D:D4:53:F8:3B:FB:D3:C6:28:64:1D:AA:08:1E:D8
      # - IOS_APP_IDENTIFIER=1495796682

      # Push Notifications
      - ENABLE_PUSH_RELAY_SERVER=true
      # - VAPID_PUBLIC_KEY=
      # - VAPID_PRIVATE_KEY=
      # - FCM_SERVER_KEY=

      # APM and Error Monitoring
      # - ELASTIC_APM_SERVER_URL=
      # - ELASTIC_APM_SECRET_TOKEN=
      # - SENTRY_DSN=
      # - SCOUT_KEY=
      # - SCOUT_NAME=
      # - SCOUT_MONITOR=
      # - NEW_RELIC_LICENSE_KEY=
      # - NEW_RELIC_APPLICATION_LOGGING_ENABLED=
      # - DD_TRACE_AGENT_URL=

      # Additional Services
      # - IP_LOOKUP_API_KEY=
      # - STRIPE_SECRET_KEY=
      # - STRIPE_WEBHOOK_SECRET=
      # - DIRECT_UPLOADS_ENABLED=
      # - AZURE_APP_ID=
      # - AZURE_APP_SECRET=

      # Rack Attack
      # - ENABLE_RACK_ATTACK=true
      # - RACK_ATTACK_LIMIT=300
      # - ENABLE_RACK_ATTACK_WIDGET_API=true
      # - RACK_ATTACK_ALLOWED_IPS=127.0.0.1,::1,192.168.0.10

      # Sidekiq
      # - SIDEKIQ_CONCURRENCY=10F

      # Development Only
      # - LETTER_OPENER=true
      # - WEBPACKER_DEV_SERVER_PUBLIC=
      # Habilita a nova função do Chatwoot 3.3.1 de responder a mensagem
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      # Habilita a função de exluir a mensagem no chatwoot e mostrar como "Mensagem Apada" no WhatsApp
      - DATABASE_SAVE_DATA_CHATS=true
      - LOCK_TO_NATASHA_INBOX=TRUE
      - NATASHA_INBOX_ID=2
      - DEFAULT_LOCALE=pt_BR
    networks:
      - sail
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]

  sidekiq:
    <<: *base
    image: chatwoot:development
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules
      - packs:/app/public/packs
      - cache:/app/tmp/cache
      - bundle:/usr/local/bundle
    depends_on:
      - redis
      - mailhog
    environment:
      # Development Settings
      - NODE_ENV=development
      - RAILS_ENV=development
      - BUNDLE_WITHOUT=''

      # Database
      - POSTGRES_HOST=pgsql
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=lucid
      - POSTGRES_PASSWORD=lucid
      - POSTGRES_DATABASE=lucid
      - RAILS_MAX_THREADS=5

      # Redis
      - REDIS_URL=redis://redis:6379

      # Security
      - SECRET_KEY_BASE=replace_with_lengthy_secure_hex

      # URLs
      - FRONTEND_URL=http://0.0.0.0:3000

      # Email - SMTP
      - SMTP_ADDRESS=mailhog
      - SMTP_PORT=1025
      - SMTP_DOMAIN=chatwoot.com
      - SMTP_AUTHENTICATION=plain
      - SMTP_ENABLE_STARTTLS_AUTO=true
      - SMTP_OPENSSL_VERIFY_MODE=peer
      - MAILER_SENDER_EMAIL=Chatwoot <accounts@chatwoot.com>

      # Storage
      - ACTIVE_STORAGE_SERVICE=local

      # Logging
      - RAILS_LOG_TO_STDOUT=true
      - LOG_LEVEL=info
      - LOG_SIZE=500

      # Push Notifications
      - ENABLE_PUSH_RELAY_SERVER=true

      # Sidekiq
      # - SIDEKIQ_CONCURRENCY=10

      - DEFAULT_LOCALE=pt_BR
    networks:
      - sail
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  vite:
    <<: *base
    image: chatwoot:development
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules
      - packs:/app/public/packs
      - cache:/app/tmp/cache
      - bundle:/usr/local/bundle
    ports:
      - "4037:3036" # Vite dev server
    environment:
      - VITE_DEV_SERVER_HOST=0.0.0.0
      - NODE_ENV=development
      - RAILS_ENV=development
      - BUNDLE_WITHOUT=''
    networks:
      - sail
    entrypoint: docker/entrypoints/vite.sh
    command: bin/vite dev

networks:
  sail:
    driver: bridge

volumes:
  redis:
  packs:
  node_modules:
  cache:
  bundle:
