type Mutation {
  """
  Despacha CreatePostCommand e devolve o Post já gravado
  """
  createPost(input: CreatePostInput!): Post!

  """
  Despacha UpdatePostCommand e devolve o Post já gravado
  """
  updatePost(input: UpdatePostInput!): Post!

  """
  Dispatches DeletePostCommand: the post is deleted logically, and its file for good
  """
  deletePost(id: ID!): Boolean!
}

input CreatePostInput {
  title: String!
  content: String!

  """
  A file uploaded through generatePresignedUrl
  """
  asset: AssetInput
}

input UpdatePostInput {
  id: ID!

  """
  null = manter o título atual
  """
  title: String

  """
  null = manter o conteúdo atual
  """
  content: String

  """
  A file uploaded through generatePresignedUrl, replacing the current one; null keeps it
  """
  asset: AssetInput
}
