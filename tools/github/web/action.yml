name: 'web'
description: 'The STATIC checks of every project, plus the build of the Next.js client'
runs:
  using: composite
  steps:
    - name: Format and lint the whole repository
      run: pnpm lint
      shell: bash

    - name: Typecheck every project
      run: npx nx run-many -t typecheck
      shell: bash

    - name: Build the web client
      run: npx nx run @nestposts/web:build
      shell: bash
